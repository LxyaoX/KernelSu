name: Build LKM for KernelSU
on:
  workflow_call:
    inputs:
      expected_size2:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_hash2:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string
      second_signature_release:
        description: 'Set to 1 when the second signature slot holds a release key instead of a PR key'
        required: false
        default: ''
        type: string
  workflow_dispatch:
jobs:
  build-lkm:
    strategy:
      matrix:
        # android14-6.1 only. The 6.6 / 6.12 / 6.18 targets were dropped together with
        # every kernel feature behind them: ksud embeds whatever this matrix produces,
        # so one entry here is what "this build supports one kernel series" means.
        kmi:
          - android14-6.1
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      expected_size2: ${{ inputs.expected_size2 || '' }}
      expected_hash2: ${{ inputs.expected_hash2 || '' }}
      second_signature_release: ${{ inputs.second_signature_release || '' }}
